name: Release Binaries

on:
  push:
    tags:
      - 'v*'
 
permissions:
  contents: write
 
jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: panos
            asset_name: panos-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: panos.exe
            asset_name: panos-windows-x64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: panos
            asset_name: panos-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: panos
            asset_name: panos-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install optimum[onnxruntime] transformers

      - name: Export AI Model
        env:
          PYTHONUTF8: "1"
        run: python scripts/export_onnx.py

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Assets
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/
          cp -r model_assets dist/
          cp panos.toml dist/
          
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a ../${{ matrix.asset_name }}.zip *
          else
            tar -czvf ../${{ matrix.asset_name }}.tar.gz *
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
