# 🌌 PANOS: Professional Suite Configuration
source_dir = "."
watch_mode = true
debounce_seconds = 2
polling_interval_ms = 100
exclude_hidden = true

# 🧠 AI Brain Settings
ai_enabled = true
model_dir = "model_assets"
ai_threshold = 0.50

# 🗑️ Managed Directories
trash_dir = ".panos_trash"
unknown_dir = ".panos_unknown"
duplicates_dir = ".panos_duplicates"
history_file = ".panos_history.json"

# 🛠️ System Hygiene
temp_extensions = ["tmp", "crdownload", "part", "cache", "download", "log", "bak"]
ignore_patterns = ["node_modules", "target", ".git", ".DS_Store", "venv", ".venv", ".idea", ".vscode"]

# =========================================================
# 📂 RULES ENGINE
# =========================================================

# --- 🖼️ Visual Media ---
[[rules]]
name = "Images"
extensions = ["jpg", "jpeg", "png", "gif", "webp", "heic", "avif", "bmp", "tiff"]
destination = "Media/Images"
semantic_label = "photograph, picture, visual art, digital image"

[[rules]]
name = "Vector Graphics"
extensions = ["svg", "ai", "eps", "pdf"]
patterns = ["logo_*", "icon_*", "*_vector*"]
destination = "Media/Vectors"
semantic_label = "illustration, graphic design, vector art, scalable graphics"

# --- 📄 Documents & Office ---
[[rules]]
name = "PDF Documents"
extensions = ["pdf"]
destination = "Documents/PDFs"
semantic_label = "official document, portable document format, scanned paper"

[[rules]]
name = "Office Documents"
extensions = ["docx", "doc", "xlsx", "xls", "pptx", "ppt", "csv", "rtf"]
destination = "Documents/Office"
semantic_label = "business report, spreadsheet, presentation, word processing"

[[rules]]
name = "E-Books"
extensions = ["epub", "mobi", "azw3"]
destination = "Documents/Library"
semantic_label = "electronic book, reading material, literature"

# --- 🎬 Audio & Video ---
[[rules]]
name = "Video"
extensions = ["mp4", "mkv", "mov", "avi", "webm", "flv"]
destination = "Media/Video"
semantic_label = "movie, footage, recording, cinematic content"

[[rules]]
name = "Audio"
extensions = ["mp3", "wav", "flac", "m4a", "ogg", "aac"]
destination = "Media/Audio"
semantic_label = "music, podcast, sound effect, voice recording"

# --- 💻 Development & Code ---
[[rules]]
name = "Source Code"
extensions = ["rs", "py", "js", "ts", "c", "cpp", "go", "java", "html", "css"]
destination = "Development/Source"
semantic_label = "programming logic, script, software development, code file"

[[rules]]
name = "Data & Config"
extensions = ["json", "yaml", "yml", "toml", "xml", "sql"]
destination = "Development/Data"
semantic_label = "structured data, configuration, database dump"

# --- 📦 Archives & Installers ---
[[rules]]
name = "Archives"
extensions = ["zip", "rar", "7z", "tar", "gz", "bz2"]
destination = "Archives"
semantic_label = "compressed file, backup package, zipped content"

[[rules]]
name = "Installers"
extensions = ["dmg", "pkg", "exe", "msi", "app"]
destination = "Installers"
semantic_label = "software installation, application setup, computer program"

# --- 🎨 Design & Assets ---
[[rules]]
name = "Design Assets"
extensions = ["psd", "fig", "sketch", "xd"]
destination = "Design/Projects"
semantic_label = "ui design, photoshop document, prototype, creative asset"

[[rules]]
name = "Fonts"
extensions = ["ttf", "otf", "woff", "woff2"]
destination = "Design/Fonts"
semantic_label = "typography, typeface, font family"
